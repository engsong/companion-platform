<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#1e112a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Radial Glow Behind Heart -->
  <circle cx="256" cy="240" r="160" fill="url(#glowGrad)"/>

  <!-- Stylized Companion Heart & Sparkle Emblem -->
  <g filter="url(#glow)" transform="translate(256, 240) scale(1.15)">
    <!-- Heart Path -->
    <path d="M 0,90 
             C -90,10 -150,-50 -130,-110 
             C -110,-170 -40,-170 0,-100 
             C 40,-170 110,-170 130,-110 
             C 150,-50 90,10 0,90 Z" 
          fill="url(#primaryGrad)"/>

    <!-- Sparkle Diamond on top right -->
    <path d="M 100,-130 Q 115,-105 140,-95 Q 115,-85 100,-60 Q 85,-85 60,-95 Q 85,-105 100,-130 Z" 
          fill="#ffffff" opacity="0.95"/>
    <!-- Small Sparkle on bottom left -->
    <path d="M -90,60 Q -80,75 -65,80 Q -80,85 -90,100 Q -100,85 -115,80 Q -100,75 -90,60 Z" 
          fill="#fef08a" opacity="0.9"/>
  </g>

  <!-- App Title Text -->
  <text x="256" y="435" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">COMPANION</text>
  <text x="256" y="470" font-family="'Noto Sans Lao', system-ui, sans-serif" font-size="20" font-weight="600" fill="#fda4af" text-anchor="middle">ແອັບຫາເພື່ອນ & ສົນທະນາ</text>
</svg>
