name: Auto Deploy to Ubuntu Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Starting automated deployment on Ubuntu server..."
            
            DEPLOY_DIR="/opt/companion-platform"
            
            if [ ! -d "$DEPLOY_DIR" ]; then
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_DIR"
            fi
            
            cd "$DEPLOY_DIR"
            
            echo "⬇️ Pulling latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "🐳 Building & restarting updated Docker containers..."
            docker compose up -d --build
            
            echo "⏳ Checking health status..."
            sleep 10
            docker ps --filter "name=companion"
            docker compose logs --tail=40 backend
            curl -f http://localhost:5000/api/health || (echo "❌ Backend health check failed! See logs above." && exit 1)

            echo "🛡️ Configuring Nginx High Security, Anti-DDoS, and Let's Encrypt CA SSL..."
            chmod +x scripts/setup-nginx-ssl.sh
            echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S bash scripts/setup-nginx-ssl.sh || sudo bash scripts/setup-nginx-ssl.sh || bash scripts/setup-nginx-ssl.sh
            
            echo "✅ Deployment completed successfully!"
