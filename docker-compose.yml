version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: companion-backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:123456789@host.docker.internal:5432/companion_db?schema=public"
      JWT_SECRET: "super-secret-companion-app-key-2026"
      BASE_URL: "http://150.95.30.215:5000"
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - companion-uploads:/app/uploads
    networks:
      - companion-net

  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
    container_name: companion-admin-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - companion-net

  mobile-app:
    build:
      context: ./mobile-app
      dockerfile: Dockerfile
    container_name: companion-mobile-app
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - companion-net

volumes:
  companion-uploads:
    name: companion-uploads

networks:
  companion-net:
    name: companion-network
