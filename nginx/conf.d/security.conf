# ==============================================================================
# HIGH-SECURITY NGINX CONFIGURATION (OWASP & Anti-DDoS Hardening)
# ==============================================================================

# 1. Hide Nginx Version (Information Disclosure Prevention)
server_tokens off;

# 2. Buffer Overflow & Request Body Protections
client_body_buffer_size 128k;
client_header_buffer_size 2k;
large_client_header_buffers 4 8k;
client_max_body_size 50M;

# 3. Anti-DDoS Connection & Rate Limiting Zones
# Limit connection concurrency per IP (mitigates connection-flooding)
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_conn_status 429;

# General API request rate limit (30 requests/sec with burst)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_status 429;

# Strict Authentication Rate Limit (5 requests/sec with burst to prevent Brute-Force)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# 4. Block Malicious Vulnerability Scanners & Bad Bots
map $http_user_agent $bad_bot {
    default 0;
    ~*(?i)(sqlmap|nikto|wpscan|masscan|havij|acunetix|nessus|nmap|dirbuster|gobuster|zgrab) 1;
}

# 5. Modern SSL / TLS Hardening Parameters (A+ Rating on SSL Labs)
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:50m;
ssl_session_tickets off;
