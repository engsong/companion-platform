# ==============================================================================
# Domain: msao.on-excapp.app (Companion Platform Admin Portal)
# High Security Reverse Proxy with Anti-DDoS, Rate Limiting & SSL CA
# ==============================================================================

# 1. HTTP Server - ACME Challenge & Permanent 301 HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name msao.on-excapp.app;

    # Let's Encrypt / Certbot Verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS with high-grade 301
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - High-Security Production Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name msao.on-excapp.app;

    # SSL Certificate & Private Key (Let's Encrypt CA)
    ssl_certificate /etc/letsencrypt/live/msao.on-excapp.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/msao.on-excapp.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/msao.on-excapp.app/chain.pem;

    # Diffie-Hellman Parameters (2048-bit)
    ssl_dhparam /etc/nginx/dhparam.pem;

    # Security Headers (OWASP Top 10 Hardening)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # DDoS Mitigation: Limit concurrent connections per IP
    limit_conn conn_limit 30;

    # Block Automated Vulnerability Scanners & Bad Bots (Silent Drop)
    if ($bad_bot) {
        return 444;
    }

    # Block Exploit Scanning Paths (.env, .git, phpmyadmin, wp-login, etc.)
    location ~* (\.git|\.env|\.svn|\.htaccess|\.config|wp-admin|wp-login|xmlrpc\.php|phpmyadmin) {
        return 444;
    }

    # Admin Web Dashboard
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Vite HMR if active
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Strict Rate-Limited Authentication Routes
    location ~ ^/api/auth/(login|register) {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend REST API
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Real-time WebSocket Socket.io
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Uploads (Images, Slips, Bank QRs)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
