# ==============================================================================
# Domain: sao.on-excapp.app (Companion Mobile App & Client PWA)
# High Security Reverse Proxy with Anti-DDoS, Rate Limiting & SSL CA
# ==============================================================================

# 1. HTTP Server - ACME Challenge & Permanent 301 HTTPS Redirect
server {
    listen 80;
    server_name sao.on-excapp.app;

    # Let's Encrypt / Certbot Verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - High-Security Production Reverse Proxy
server {
    listen 443 ssl;
    server_name sao.on-excapp.app;

    # SSL Certificate & Private Key (Let's Encrypt CA)
    ssl_certificate /etc/letsencrypt/live/companion/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/companion/privkey.pem;

    # TLS Protocols & Ciphers (Grade A+ Security)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Security Headers (OWASP Top 10 Hardening)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # DDoS Mitigation: Limit concurrent connections per IP
    limit_conn conn_limit 30;

    # Block Automated Vulnerability Scanners & Bad Bots (Silent Drop)
    if ($bad_bot) {
        return 444;
    }

    # Block Exploit Scanning Paths (.env, .git, phpmyadmin, wp-login, etc.)
    location ~* (\.git|\.env|\.svn|\.htaccess|\.config|wp-admin|wp-login|xmlrpc\.php|phpmyadmin) {
        return 444;
    }

    # Client Web App (Mobile App UI)
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Strict Rate-Limited Authentication Routes (Anti-Brute-Force & Credential Stuffing)
    location ~ ^/api/auth/(login|register) {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General Backend REST API Routes (Protected by API Rate Limit)
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Real-time WebSocket Socket.io (Low-Latency Bi-Directional Tunnel)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Uploads (Images, KYC, Slips, Bank QRs)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
